[metadata]
scenario_name = "Aged-out KYC manual-review audit: joint applications created 2024-06-01..2024-06-30"
scenario_description = """
Compliance Ops is asked why joint account application 32855 -- both applicants
stuck in KYC manual review -- ended up 'rejected'. The real question is whether
it was decided on its merits or closed out in a bulk aging-out sweep. Fully
data-internal: the cohort, the sweep date, and the applicant-level KYC state are
all derived from the warehouse, so nothing depends on the Confluence KYC policy
page. Deliverables are FILES ONLY: /workspace/metrics.json +
/workspace/report.md. No gym write.

=== GOLD ===
Provenance: decision_replay_candidates.json#dr-8ec3632ae05bd91f
(family kyc_manual_review, branch kyc_mr_unresolved_aged_out, seed row 32855).
Cohort (pinned): rds.account_applications WHERE original_status='manual_review'
AND account_type='joint' AND created_at >= TIMESTAMP '2024-06-01' AND created_at
< TIMESTAMP '2024-07-01'.
Rule (data-internal): group the cohort on cast(final_decisioned_at as date). One
date is a gross outlier -- 2025-04-09 with 50 rejections; every other decision
date carries <= 16 and lands within weeks of creation. Those 50 are the aged-out
applications. Applications decided on any other date were resolved on their
merits; a final_decisioned_at of NULL means still open.
Person level: join rds.account_person_applications -> rds.person_applications;
"unresolved" = kyc_status='manual_review'.

Gold values (re-verified on the served warehouse via zeta3-sql-gym):
  sweep_date                 = "2025-04-09"
  cohort_size                = 116
  aged_out                   = 50   (all status='rejected')
  resolved_before_sweep      = 65   (43 approved + 22 rejected)
  still_manual_review        = 1
  unresolved_person_kyc      = 68   (of 100 applicant records on the 50; 0 denied)
  both_applicants_unresolved = 18
  days_in_manual_review      = 309  (application 32855)
Example: application 32855 (personal_checking, joint) created
2024-06-04T03:39:00.983193, manual_review_mailers_sent_at
2024-06-04T03:41:20.778327, send_manual_review_reminders_on 2024-06-07,
final_decisioned_at 2025-04-09T16:56:11.279649, status 'rejected'. Its two
person applications 80596 (user 106471) and 80597 (user 106472) are both
kyc_status='manual_review', kyc_journey_status='waiting_review',
awaiting_documentation=true, never approved and never denied.

Gold SQL (rollup): with c as (select * from "rds.account_applications" where
original_status='manual_review' and account_type='joint' and created_at >=
TIMESTAMP '2024-06-01' and created_at < TIMESTAMP '2024-07-01'), sw as (select *
from c where status='rejected' and cast(final_decisioned_at as date) = DATE
'2025-04-09'), pl as (select sw.id as aid, pa.kyc_status from sw join
"rds.account_person_applications" apa on apa.account_application_id = sw.id join
"rds.person_applications" pa on pa.id = apa.person_application_id) select
(select count(*) from c) as cohort_size, (select count(*) from sw) as aged_out,
(select count(*) from c where status in ('approved','rejected') and
cast(final_decisioned_at as date) <> DATE '2025-04-09') as
resolved_before_sweep, (select count(*) from c where status='manual_review') as
still_manual_review, (select count(*) from pl where kyc_status='manual_review')
as unresolved_person_kyc, (select count(*) from (select aid from pl where
kyc_status='manual_review' group by aid having count(*) = 2) x) as
both_applicants_unresolved, (select datediff('day', cast(created_at as date),
cast(final_decisioned_at as date)) from "rds.account_applications" where id =
32855) as days_in_manual_review
See solution/golden_trajectory.json for the full step chain.
"""
source_task_id = "dr-8ec3632ae05bd91f"
